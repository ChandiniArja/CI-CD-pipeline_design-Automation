name: Embedded CI/CD Pipeline

on:
  push:
    branches: [develop]
  schedule:
    # NOTE: cron is in UTC in GitHub Actions
    - cron: "0 0 * * *"

jobs:
  # ========== BUILD STAGE ============
  build-a:
    name: Build Component A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd components/a
          make clean
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: component-a-bin
          path: components/a/*.bin

  build-b:
    name: Build Component B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd components/b
          make clean
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: component-b-bin
          path: components/b/*.bin

  build-c:
    name: Build Component C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd components/c
          make clean
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: component-c-bin
          path: components/c/*.bin

  # ========== TEST STAGE ==========
  test-a:
    name: Test Component A
    needs: build-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-a-bin
          path: components/a
      - run: |
          cd components/a
          make test

  test-b:
    name: Test Component B
    needs: build-b
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-b-bin
          path: components/b
      - run: |
          cd components/b
          make test

  test-c:
    name: Test Component C
    needs: build-c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-c-bin
          path: components/c
      - run: |
          cd components/c
          make test

  # ========== PACKAGE STAGE ==========
  package:
    name: Create Deployment Package
    needs: [test-a, test-b, test-c]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all component binaries
        uses: actions/download-artifact@v4
        with:
          path: deploy/binaries

      - name: Create deployment package
        run: |
          echo "Creating embedded deployment package"
          tar -czvf embedded_release.tar.gz deploy/

      - uses: actions/upload-artifact@v4
        with:
          name: embedded-release
          path: embedded_release.tar.gz
